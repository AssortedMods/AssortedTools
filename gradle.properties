license=GPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedTools/issues
# Family
# The mods this repo builds share one creative tab and one manual section, under this namespace.
family_name=Assorted Tools
family_id=assortedtools
# The bundle's first version after the split. Every part refuses to load next to the old mod from before it.
family_split_version=12.0.0
# Each is a folder under mods with its own gradle.properties.
assorted_mods=tools,gearsets,hammers,multitools,machetes,shears,portableworkbench,throwingspears,boomerangs,buckets,suits,wands,staffs,ultimatefist,pokeball
# Build
# The AssortedBuild release these mods build with. Minecraft, NeoForge, Fabric and tooling versions
# all come from it; bump it to move to a newer set.
assortedbuild_version=1.21.1.0
mod_author=Grim3212
# The AssortedLib these mods need: its minimum, declared as such on both loaders.
assortedlib_version=21.1.0.0
# Knobs. Absent means off.
jei_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel: release, beta or alpha. -PreleaseType overrides it.
release_type=release
# Vanilla 1.21.1 logs this at startup for every modded entity type that saves, in production too
# (NeoForge patches it out); there is no data fixer for a mod to register. Read by each mod's runs and the all run.
gametest_log_allow=No data fixer registered for (assortedstaffs:ice_charge|assortedpokeball:pokeball|assortedboomerangs:(wood|diamond)_boomerang|assortedthrowingspears:better_spear)$
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
