license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedTools/issues
# Family
# The mods this repo builds share one creative tab and one manual section, under this namespace.
family_name=Assorted Tools
family_id=assortedtools
family_icons=assortedhammers:iron_hammer,assortedmultitools:diamond_multitool,assortedwands:building_wand,assortedboomerangs:diamond_boomerang,assortedextramaterials:steel_pickaxe
family_manual_order=120
# Each is a folder under mods with its own gradle.properties.
assorted_mods=tools,extramaterials,hammers,multitools,machetes,shears,portableworkbench,throwingspears,boomerangs,buckets,suits,wands,staffs,ultimatefist,pokeball
# Build
# The AssortedBuild release these mods build with. Minecraft, NeoForge, Fabric and tooling versions
# all come from it; bump it to move to a newer set.
assortedbuild_version=26.2.6
mod_author=Grim3212
# The AssortedLib these mods need: its minimum, declared as such on both loaders.
assortedlib_version=4.3.0
# Knobs. Absent means off.
jei_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel: release, beta or alpha. -PreleaseType overrides it.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
